name: "✨ 功能建议"
description: "提出新功能或改进建议"
title: "[Feature] "
labels: ["enhancement"]
assignees: []
projects: []
milestone: ""

body:
  - type: markdown
    attributes:
      value: |
        ## ✨ 功能建议

        感谢您提出建议！请详细描述您的想法。

        ---
        
  - type: textarea
    id: feature-description
    attributes:
      label: "功能描述"
      description: "清晰描述您建议的功能"
      placeholder: "描述这个功能应该做什么"
    validations:
      required: true

  - type: textarea
    id: problem-solved
    attributes:
      label: "🎯 要解决的问题"
      description: "这个功能解决什么问题？为什么需要它？"
      placeholder: |
        问题描述：
        当前用户无法...

        影响：
        这导致...
        
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "💡 建议的解决方案"
      description: "您希望如何实现这个功能？"
      placeholder: |
        建议的实现方式：
        1. 添加新的API端点...
        2. 修改现有组件...
        
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: "📋 使用场景"
      description: "这个功能的主要使用场景是什么？"
      placeholder: |
        场景1：用户A想要...
        场景2：管理员B需要...
        
    validations:
      required: true

  - type: dropdown
    id: feature-type
    attributes:
      label: "功能类型"
      options:
        - 新功能（全新功能）
        - 功能改进（对现有功能的增强）
        - 性能优化
        - 用户体验改进
        - 安全加固
        - 文档完善
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: "预期复杂度"
      options:
        - 低（1-2天开发）
        - 中（3-7天开发）
        - 高（1-2周开发）
        - 非常高（2周以上）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "🔄 替代方案"
      description: "是否有其他替代方案？（可选）"
      placeholder: "除了这个方案，还考虑过..."

  - type: textarea
    id: references
    attributes:
      label: "🔗 相关资料"
      description: "相关的Issue、文档、示例等（可选）"
      placeholder: |
        - 参考项目：...
        - 相关Issue：#123
        - 设计稿：...

  - type: checkboxes
    id: willingness
    attributes:
      label: "您的意愿"
      options:
        - label: "我愿意帮助实现这个功能"
          required: false
        - label: "我可以提供测试或反馈"
          required: false
        - label: "我已经考虑过技术实现方案"
          required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "确认清单"
      options:
        - label: "我确认这是一个新功能建议，而非Bug报告"
          required: true
        - label: "我已经搜索过现有Issue，确认这不是重复建议"
          required: true
