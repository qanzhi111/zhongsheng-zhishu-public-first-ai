name: "🐛 Bug报告"
description: "报告一个Bug帮助我们改进项目"
title: "[Bug] "
labels: ["bug"]
assignees: []
projects: []
milestone: ""

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug报告

        感谢您报告Bug！请填写以下信息帮助我们快速定位和修复问题。

        ---
        
  - type: textarea
    id: bug-description
    attributes:
      label: "Bug描述"
      description: "简要清晰地描述这个Bug是什么"
      placeholder: "例如：当用户点击提交按钮时，应用崩溃并显示错误信息"
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "复现步骤"
      description: "详细描述如何复现这个Bug"
      placeholder: |
        1. 访问页面 X
        2. 点击按钮 Y
        3. 输入内容 Z
        4. 出现错误
        
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "✅ 预期行为"
      description: "描述您期望发生什么"
      placeholder: "点击提交按钮后，应该显示成功提示信息"
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: "❌ 实际行为"
      description: "描述实际发生了什么"
      placeholder: "点击提交按钮后，应用崩溃，显示 'TypeError: Cannot read property' 错误"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "严重程度"
      description: "Bug的严重程度"
      options:
        - 低（界面问题，不影响功能）
        - 中（功能受限，但有替代方案）
        - 高（核心功能无法使用）
        - 严重（系统崩溃或数据丢失）
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "优先级"
      description: "Bug的修复优先级"
      options:
        - 低（有时间再修复）
        - 中（尽快修复）
        - 高（需要立即修复）
        - 紧急（阻塞发布）
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "环境信息"
      description: "操作系统、浏览器、版本等信息"
      placeholder: "例如：Windows 11, Chrome 120.0, Node.js 18"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "📸 截图和日志"
      description: "如果有截图或错误日志，请粘贴在这里"
      placeholder: |
        错误日志：
        ```
        TypeError: Cannot read property 'value' of undefined
            at Object.submit (/app/index.js:45:15)
        ```
        
  - type: textarea
    id: suggested-fix
    attributes:
      label: "💡 建议的修复方案"
      description: "如果有建议的修复方案，请提供（可选）"
      placeholder: "可能需要在使用前检查对象是否存在"

  - type: textarea
    id: additional-context
    attributes:
      label: "📝 其他信息"
      description: "任何其他有助于理解问题的信息（可选）"
      placeholder: "相关链接、相关Issue等"

  - type: checkboxes
    id: checklist
    attributes:
      label: "确认清单"
      options:
        - label: "我已经搜索过现有Issue，确认这不是重复问题"
          required: true
        - label: "我提供了完整的复现步骤"
          required: true
        - label: "我包含了错误日志或截图"
          required: false
