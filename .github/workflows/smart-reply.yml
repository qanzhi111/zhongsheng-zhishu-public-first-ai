name: "智能响应生成"

on:
  pull_request:
    types: [opened, closed, review_requested]
  issues:
    types: [opened, closed]
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/15 * * * *'  # 每15分钟检查一次

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  smart-pr-response:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    steps:
      - name: 智能PR响应
        id: respond
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;
            const title = pr.title.toLowerCase();
            const author = pr.user.login;
            const files = pr.changed_files || 0;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;

            let response = '';
            let labels = [];
            let priority = 'low';

            // 根据PR类型生成响应
            if (title.includes('feat') || title.includes('add') || title.includes('new')) {
              response = `✨ **感谢 @${author} 提交新功能!**

## 功能概述
- 📝 标题: ${pr.title}
- 📂 文件变更: ${files} 个
- ➕ 新增: ${additions} 行 | ➖ 删除: ${deletions} 行

## 审查重点
- ✅ 功能完整性
- ✅ 代码质量
- ✅ 测试覆盖
- ✅ 文档更新

## 下一步
1. CI检查通过后会自动分配审查者
2. 预计审查时间: 1-2个工作日

---
*🎯 为民AI自动回复*`;
              labels = ['enhancement', 'needs-review'];
              priority = 'medium';

            } else if (title.includes('fix') || title.includes('bug')) {
              response = `🐛 **感谢 @${author} 修复Bug!**

## Bug修复信息
- 📝 标题: ${pr.title}
- 📂 文件变更: ${files} 个

## 审查重点
- ✅ 问题复现确认
- ✅ 修复验证
- ✅ 是否引入新问题
- ⚠️ 测试用例是否覆盖

## 紧急程度
${title.includes('critical') || title.includes('urgent') ? '🔴 **紧急** - 将优先处理' : '🟡 **一般** - 正常流程处理'}

---
*🎯 为民AI自动回复*`;
              labels = ['bug', 'needs-review'];
              priority = 'high';

            } else if (title.includes('docs') || title.includes('doc')) {
              response = `📖 **感谢完善文档!**

## 文档变更
- 📝 标题: ${pr.title}
- 📂 文件变更: ${files} 个

## 审查重点
- ✅ 内容准确性
- ✅ 格式一致性
- ✅ 链接有效性

---
*🎯 为民AI自动回复*`;
              labels = ['documentation'];

            } else if (title.includes('refactor')) {
              response = `♻️ **代码重构PR**

## 重构概述
- 📝 标题: ${pr.title}
- 📂 文件变更: ${files} 个

## 审查重点
- ✅ 重构目的明确
- ✅ 不改变外部行为
- ✅ 测试通过
- ✅ 代码可读性提升

---
*🎯 为民AI自动回复*`;
              labels = ['refactoring'];

            } else if (title.includes('deps') || title.includes('depend')) {
              response = `📦 **依赖更新PR**

## 更新内容
- 📝 标题: ${pr.title}
- 📂 文件变更: ${files} 个

## 自动处理
${files <= 5 ? '✅ 小幅更新，将自动合并' : '⏳ 需要审查后合并'}

---
*🎯 为民AI自动回复*`;
              labels = ['dependencies'];
              if (files <= 5) {
                labels.push('automerge');
              }

            } else {
              response = `👋 **感谢 @${author} 的贡献!**

## PR信息
- 📝 标题: ${pr.title}
- 📂 文件变更: ${files} 个

## 审查流程
1. 自动化检查 (CI)
2. 代码审查
3. 合并

---
*🎯 为民AI自动回复*`;
              labels = ['needs-review'];
            }

            // 添加优先级标签
            if (priority === 'high') {
              labels.push('priority-high');
            }

            // 发布响应
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: response
            });

            // 添加标签
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels
            });

            console.log(`已自动回复 PR #${prNumber}`);

  smart-issue-response:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: 智能Issue响应
        id: respond-issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = issue.number;
            const title = issue.title.toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const author = issue.user.login;
            const labels = issue.labels.map(l => l.name);

            let response = '';
            let newLabels = [...labels];

            // Issue分类响应
            if (labels.includes('bug')) {
              response = `🐛 **感谢 @${author} 报告Bug!**

我们已经收到您的Bug报告。

## 请协助确认
- [ ] 复现步骤
- [ ] 预期行为
- [ ] 实际行为
- [ ] 环境信息 (操作系统、版本等)
- [ ] 错误日志/截图

## 处理流程
1. 确认Bug ✓
2. 定位问题
3. 修复
4. 验证

---
*🎯 为民AI自动回复*`;
              newLabels.push('needs-triage');

            } else if (labels.includes('enhancement')) {
              response = `✨ **感谢 @${author} 提出功能建议!**

## 功能建议
> ${issue.title}

## 请补充
- 🎯 要解决的问题
- 💡 建议的解决方案
- 📊 预期影响/效果

## 评估流程
1. 需求分析
2. 技术评估
3. 优先级排序
4. 纳入开发计划

---
*🎯 为民AI自动回复*`;

            } else if (labels.includes('question')) {
              response = `❓ **感谢 @${author} 的提问!**

我们会尽快回复您的问题。

## 请提供
- 🔍 您尝试了什么？
- ❌ 遇到了什么错误？
- 💻 您的环境是什么？

## 快速链接
- 📖 [FAQ文档](./docs/faq.md)
- 💬 [社区讨论](https://github.com/${owner}/${repo}/discussions)

---
*🎯 为民AI自动回复*`;

            } else if (title.includes('security') || body.includes('vulnerability')) {
              response = `🛡️ **安全相关报告**

感谢报告安全问题!

## 紧急处理
我们的安全团队会立即处理。

## 保密须知
请勿在公开Issue中透露漏洞细节。

---
*🎯 为民AI自动回复*`;
              newLabels.push('security');
              newLabels.push('priority-high');

            } else {
              response = `👋 **感谢 @${author} 的反馈!**

我们已经收到您的Issue。

## 处理流程
1. 分类处理
2. 优先级评估
3. 处理/回复

---
*🎯 为民AI自动回复*`;
              newLabels.push('needs-triage');
            }

            // 发布响应
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: response
            });

            // 更新标签
            if (newLabels.length > labels.length) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: newLabels.filter(l => !labels.includes(l))
              });
            }

            console.log(`已自动回复 Issue #${issueNumber}`);

  track-learning:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: 记录学习数据
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // 记录PR数据用于学习
            const prData = {
              number: pr.number,
              title: pr.title,
              user: pr.user,
              labels: pr.labels,
              merged: pr.merged,
              merged_at: pr.merged_at,
              created_at: pr.created_at
            };

            console.log('PR学习数据已记录:', JSON.stringify(prData, null, 2));

            // 更新记忆库（如果GitHub Actions有写入权限）
            // 这里只是记录，实际存储需要后端配合
            core.setOutput('pr_learned', JSON.stringify({
              type: 'pr',
              number: pr.number,
              title: pr.title,
              merged: pr.merged,
              merged_at: pr.merged_at
            }));
