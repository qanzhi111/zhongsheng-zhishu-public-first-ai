name: "欢迎新贡献者"

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: 欢迎PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;
            
            const welcomeMessage = `
            🎉🎉🎉 @${author} 感谢您的贡献！

            欢迎加入**众生智枢**开发者社区！

            ## 📋 PR审查流程

            1. 🤖 自动化检查（CI/CD）
            2. 👀 代码审查
            3. ✅ 合并到主分支

            ## 💡 快速链接

            - 📖 [开发者文档](https://github.com/${owner}/${repo}/blob/main/DEVELOPER_RECRUITMENT.md)
            - 🎯 [新手任务](https://github.com/${owner}/${repo}/issues?q=label%3A%22good+first+issue%22)
            - 💬 [社区交流](https://github.com/${owner}/${repo}/discussions)
            - 📜 [行为准则](https://github.com/${owner}/${repo}/blob/main/.github/CODE_OF_CONDUCT.md)

            ## 🏆 贡献积分

            您的PR被合并后，将获得贡献积分！

            | PR类型 | 积分 |
            |--------|------|
            | ✨ 新功能 | +30分 |
            | 🐛 Bug修复 | +10分 |
            | 📖 文档完善 | +5分 |
            | 🧪 测试编写 | +15分 |
            | 🔧 维护 | +10分 |

            ## 🎯 下一步

            - 💬 关注PR审查评论
            - 🔄 及时响应反馈
            - ✅ 保持分支同步

            如果有任何问题，随时在评论区提问！

            ---

            **智枢为民，众生平等；AI为公，永不异化。** 🌟
            `;
            
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: welcomeMessage
            });

      - name: 添加PR标签
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = ['awaiting-review'];
            const prNumber = context.payload.pull_request.number;
            
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: labels
              });
            } catch (error) {
              console.log('标签添加失败，可能已存在');
            }

      - name: 欢迎Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;
            const author = context.payload.issue.user.login;
            const labels = context.payload.issue.labels.map(l => l.name);
            
            const isBug = labels.includes('bug');
            const isFeature = labels.includes('enhancement');
            const isQuestion = labels.includes('question');
            
            let welcomeMessage = `
            👋 感谢 @${author} 提交Issue！

            您的反馈对我们非常重要！
            `;
            
            if (isBug) {
              welcomeMessage += `
              
              🐛 我们会尽快处理这个Bug。

              为了更快定位问题，请提供：
              - 复现步骤
              - 预期行为
              - 实际行为
              - 环境信息（操作系统、版本等）
              - 错误日志截图
              `;
            } else if (isFeature) {
              welcomeMessage += `
              
              ✨ 感谢您提出功能建议！

              我们会认真评估您的想法。
              建议包括：
              - 要解决的问题
              - 建议的解决方案
              - 使用场景
              - 预期影响
              `;
            } else if (isQuestion) {
              welcomeMessage += `
              
              ❓ 您好！我们很乐意帮助您。

              请提供更多详细信息：
              - 您尝试了什么？
              - 遇到了什么错误？
              - 您的环境是什么？
              
              查看 [FAQ文档](https://github.com/${owner}/${repo}/wiki/FAQ) 可能已有答案。
              `;
            } else {
              welcomeMessage += `
              
              💡 感谢您的反馈！

              我们会尽快处理并回复您。
              `;
            }
            
            welcomeMessage += `
            
            ## 📞 联系方式

            - 💬 在此Issue下评论讨论
            - 📧 邮箱：contact@zhongshengzhishu.org
            - 💬 微信：zhongshengzhishu

            ---

            **一起让众生智枢变得更好！** 🚀
            `;
            
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: welcomeMessage
            });
