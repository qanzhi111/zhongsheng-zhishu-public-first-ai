name: "自动合并安全PR"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
  schedule:
    - cron: '*/30 * * * *'  # 每30分钟检查一次

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: 检查PR状态
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;

            // 检查标签
            const labels = pr.labels.map(l => l.name);
            const canAutoMerge = labels.includes('automerge') || labels.includes('safe-to-merge');

            // 检查CI状态
            const { data: checks } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: pr.head.sha
            });

            const allChecksPassed = checks.check_runs.every(
              check => check.conclusion === 'success'
            );

            // 检查PR是否可合并
            const { data: prData } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            core.setOutput('can_merge', canAutoMerge && allChecksPassed && prData.mergeable);
            core.setOutput('pr_number', prNumber);
            core.setOutput('all_checks_passed', allChecksPassed);

      - name: 自动合并
        if: steps.check.outputs.can_merge == 'true'
        run: |
          gh pr merge ${{ steps.check.outputs.pr_number }} --admin --squash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 通知失败状态
        if: steps.check.outputs.can_merge == 'false' && steps.check.outputs.all_checks_passed == 'false'
        run: |
          echo "PR #${{ steps.check.outputs.pr_number }} 等待CI通过或需要人工审核"
